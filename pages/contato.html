<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style/style-contato.css">
    <script src="../js/script.js" defer></script>

    <title>Contato - Vetremant</title>
</head>
<body>

    <header class="header-desktop">
        <img src="../assets-images/symbol1.svg" alt="Símbolo do site de notícias Vetremant">
        <a href="index.html">
            <img src="../assets-images/logo1.svg" alt="Nome do site de notícias Vetremant">
        </a>
        <button>
            <img src="../assets-images/icon-menu-hamburguer 1.svg" alt="Ícone de menu hambúrguer">
        </button>

        <nav>
            <button>
                <img src="../assets-images/cancel.svg" alt="Ícone de X para fechar o menu">
            </button>
            <a href="index.html#home">Home</a>
            <a href="index.html#secao2">Destaques</a>
            <a href="index.html#secao3">Novidades</a>
        </nav>
    </header>

    <div class="container" id="pagina-contato">
        <main class="contato-main">
            <h1>Fale Conosco</h1>
            <p>Tem alguma dúvida, sugestão ou proposta? Preencha o formulário abaixo.</p>
            <hr>
            
            <form action="#" method="POST" class="form-contato">
                <div class="form-group">
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Seu e-mail" required>
                </div>
                <div class="form-group">
                    <input type="text" id="assunto" name="assunto" placeholder="Assunto" required>
                </div>
                <div class="form-group">
                    <textarea id="mensagem" name="mensagem" rows="6" placeholder="Sua mensagem" required></textarea>
                </div>
                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
        </main>
    </div>

    <footer>
        <div class="footer-logos">
            <img src="../assets-images/symbol1.svg" alt="Símbolo para footer do site de notícias Vetremant">
            <img src="../assets-images/logo1.svg" alt="Logo para footer do site de notícias Vetremant">
        </div>
        <p>© Vetremant MMXXV – Moda com propósito. Todos os direitos reservados.</p>
        <a href="contato.html">FALE CONOSCO</a>
    </footer>

</body>
</html>
