<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="/style/style-login.css">
    <link rel="stylesheet" href="/style/style-mobile.css">
    <script src="/js/script-login.js" defer></script>
    <title>Login - Vetremant</title>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <img src="/assets-images/symbol1.svg" alt="Símbolo do site Vetremant">
            <img src="/assets-images/logo1.svg" alt="Nome do site Vetremant">
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="Digite seu nome" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
